# Porphyx overlay: hooks de GPU/RGB. Se carga al final (zz-) y solo pisa lo que declara.
[hooks]
battery_charging = []
battery_discharging = []
battery_percentage_changed = []
battery_plugged = []
bluetooth_disabled = []
bluetooth_enabled = []
colors_changed = [ "HOOK" ]
logging_out = []
power_profile_changed = [ "/usr/local/bin/porphyx-power apply \"$NOCTALIA_POWER_PROFILE\"" ]
rebooting = []
session_locked = []
session_unlocked = []
shutting_down = []
started = [ "HOOK", "/usr/local/bin/porphyx-power apply", "HOME/.local/bin/porphyx-plugins" ]
theme_mode_changed = [ "HOOK" ]
wallpaper_changed = [ "HOOK" ]
wifi_disabled = []
wifi_enabled = []


[shell]
launch_apps_custom_command = "HOME/.local/bin/porphyx-gpu-launch $CMD"

# Pantalla de bloqueo compacta (caja de login + reloj). Las claves llevan el nombre de la salida.
[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 955.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.0
        background_radius = 0.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 0.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = false
        show_password_reveal = false
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 600.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = true
        background_color = "primary"
        background_opacity = 0.0
        background_padding = 32
        background_radius = 0
        format = "{:%-I:%M:%S %p}"
        shadow = true
