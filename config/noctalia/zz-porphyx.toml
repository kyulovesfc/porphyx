# Porphyx overlay: hook de arranque (plugins) y greeter_sync. Se carga al final (zz-) y solo pisa lo que declara.
[hooks]
battery_charging = []
battery_discharging = []
battery_percentage_changed = []
battery_plugged = []
bluetooth_disabled = []
bluetooth_enabled = []
colors_changed = []
logging_out = []
power_profile_changed = []
rebooting = []
session_locked = []
session_unlocked = []
shutting_down = []
started = [ "HOME/.local/bin/porphyx-plugins" ]
theme_mode_changed = []
wallpaper_changed = []
wifi_disabled = []
wifi_enabled = []


[shell]

# Greeter: fondo y paleta siguen al shell, sin prompt (regla polkit en greeter-setup).
[shell.greeter_sync]
auto_sync = true
privilege_command = "pkexec"
